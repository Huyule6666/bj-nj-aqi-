name: collect-aqi

# 定时采集数据并提交回仓库（提交会触发 deploy.yml 部署静态站点）
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时（UTC）：08/14/20/02 时（北京时间）
  workflow_dispatch: {}      # 手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements-collect.txt

      - name: 采集数据
        run: python collect.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aqi.db static/site_data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动采集 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
