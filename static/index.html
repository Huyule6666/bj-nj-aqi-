<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京 · 南京空气质量监测</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">
<header class="page-header">
  <h1>北京 · 南京空气质量监测</h1>
  <p class="byline">中央民族大学 生命与环境科学学院 · 王垣贺</p>
  <p class="subtitle">
    实时浓度与官方每日 AQI 来自中国环境监测总站发布平台（air.cnemc.cn），北京实时数据在总站平台
    不可达时由北京市生态环境监测中心（zx.bjmemc.com.cn）兜底；历史日均浓度（PM2.5/PM10/SO₂/NO₂/CO、O3-8h）
    官方不公开历史值，暂以 Open-Meteo CAMS 模型数据补采并标注「模型数据」；天气来自 Open-Meteo。数据仅供个人参考。
  </p>
  <div class="actions">
    <button id="btn-collect" class="btn">立即补采</button>
    <button id="btn-refresh" class="btn btn-ghost">刷新</button>
  </div>
</header>

<!-- KPI 卡 -->
<section class="kpi-row" id="kpi-row"></section>

<!-- 天气 -->
<section class="panel">
  <div class="panel-head"><h2>天气</h2><span class="muted">Open-Meteo</span></div>
  <div class="weather-row" id="weather-row"></div>
</section>

<!-- 数据明细（可访问性兜底） -->
<section class="panel">
  <details>
    <summary>数据明细表（北京）</summary>
    <div class="table-wrap"><table id="table-北京"></table></div>
  </details>
  <details>
    <summary>数据明细表（南京）</summary>
    <div class="table-wrap"><table id="table-南京"></table></div>
  </details>
</section>

<!-- 状态角标 -->
<footer class="status-bar" id="status-bar">正在加载…</footer>

<script src="app.js"></script>
</body>
</html>
